name: Build and Release Android TV APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Sign Release APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platforms;android-34 build-tools;34.0.0'

    - name: Generate Gradle Wrapper
      run: gradle wrapper --gradle-version 8.5

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Release APK
      run: ./gradlew assembleRelease --no-daemon

    - name: Generate Debug Keystore for Signing
      run: |
        keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keypass android -storepass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

    - name: Sign APK with Debug Keystore
      run: |
        # ค้นหาไฟล์ apksigner อัตโนมัติจาก SDK
        APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | head -n 1)
        
        # จัดการเซ็นชื่อลงบนไฟล์ APK
        $APKSIGNER sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android app/build/outputs/apk/release/app-release-unsigned.apk
        
        # เปลี่ยนชื่อไฟล์ให้อ่านง่ายและพร้อมติดตั้ง
        mv app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/lenna-tv-release.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: lenna-tv-release-apk
        path: app/build/outputs/apk/release/lenna-tv-release.apk

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Download APK Artifact
      uses: actions/download-artifact@v4
      with:
        name: lenna-tv-release-apk
        path: app/build/outputs/apk/release/

    - name: Generate Release Tag
      id: tag
      run: echo "tag_name=v1.0.$(date +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.tag_name }}
        name: "Lenna TV Release ${{ steps.tag.outputs.tag_name }}"
        files: app/build/outputs/apk/release/lenna-tv-release.apk
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}